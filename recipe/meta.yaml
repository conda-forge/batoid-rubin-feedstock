{% set name = "batoid-rubin" %}
{% set version = "0.7.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/batoid_rubin-{{ version }}.tar.gz
  sha256: 6f611cda7de2bef891749d2eaf99d63ddb0829531a6c77e88df2426d5f0e79af

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - batoid >=0.4.2
    - ipywidgets
    - astropy-base
    - galsim
    - numpy
    - pyyaml
    - scipy
    - danish >=0.2.0
    - __unix
    - zenodo_get
    - requests

test:
  imports:
    - batoid_rubin
  # fails and does not matter
  # commands:
  #   - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jmeyers314/batoid_rubin
  summary: Rubin telescope models for batoid
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - beckermr
    - jmeyers314
